; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:e32r40t_gfx]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
test_build_src = yes

  
monitor_speed = 115200
monitor_filters = 
	esp32_exception_decoder
	time

lib_deps =
	;bodmer/TFT_eSPI @^2.5.43
	moononournation/GFX Library for Arduino @ 1.6.0
	tobiasschuerg/ESP8266 Influxdb @ ^3.13.2
	me-no-dev/AsyncTCP @ 3.3.2
	me-no-dev/ESPAsyncWebServer @ 3.6.0
	bblanchon/ArduinoJson@^7.4.3
	paulstoffregen/XPT2046_Touchscreen
	;tamctec/TAMC_GT911 @ ^1.0.2
	adafruit/Adafruit BusIO @ ^1.16.1
	adafruit/Adafruit MCP9600 Library @ ^2.0.4
    SPI

	

build_flags = 
	-I./src
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=3	
	'-DOTA_VERSION="local_development"'
    -mfix-esp32-psram-cache-issue
	-DCONFIG_ESP_TASK_WDT_EN=0
	;-D LV_LVGL_H_INCLUDE_SIMPLE
    ;-D LV_USE_DEMO_WIDGETS
    ;-D TFT_WIDTH=800
    ;-D TFT_HEIGHT=480
    ;-I ./includeplatform = espressif32

	; TFT_eSPI library settings:
	; ######################################################
	;-D USER_SETUP_LOADED=1
	;-include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup42_ILI9341_ESP32.h
	;-D DISABLE_ALL_LIBRARY_WARNINGS=1
	;#######################################################

build_unflags = 
	-std=gnu++11